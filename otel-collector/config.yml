receivers:
  # OTLP receiver - accepts traces, metrics, and logs
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://127.0.0.1:*"
            - "http://0.0.0.0:*"
          allowed_headers:
            - "*"
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Batch processor - reduces number of outgoing connections
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter - prevents out of memory issues
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource processor - adds additional resource attributes
  resource:
    attributes:
      - key: service.namespace
        value: dash-telemetry
        action: insert
      - key: deployment.environment
        from_attribute: environment
        action: insert

  # Attributes processor - modify span/log attributes for Loki label extraction
  attributes:
    actions:
      # Copy resource attributes as record attributes so Loki can index them
      - key: service.name
        action: upsert
        from_attribute: service.name
      - key: mfe
        action: upsert
        from_attribute: mfe
      - key: environment
        action: upsert
        from_attribute: environment
      - key: http.url
        action: upsert
        from_attribute: url.full
      - key: http.method
        action: upsert
        from_attribute: http.request.method

  # Resource detection - ensures resource attributes are propagated
  resourcedetection:
    detectors: [system, env]
    timeout: 2s
    override: false

exporters:
  # Tempo exporter - for distributed traces
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Loki exporter - for logs
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  # Debug exporter - prints to console (useful for development)
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

  # Prometheus exporter - expose metrics for scraping
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: dash_telemetry

service:
  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [otlp/tempo, debug]
    
    # Metrics pipeline
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
    
    # Logs pipeline - add resourcedetection to propagate resource attributes
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, attributes, batch]
      exporters: [loki, debug]

  # Telemetry configuration for the collector itself
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8888

  extensions: []
