services:
  # OpenTelemetry Collector - receives telemetry data from frontend apps
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: dash-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector/config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
    depends_on:
      - tempo
      - loki
    networks:
      - dash-monitor
    restart: unless-stopped

  # Grafana Tempo - distributed tracing backend
  tempo:
    image: grafana/tempo:2.3.1
    container_name: dash-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo/config.yml:/etc/tempo.yml
      - ./data/tempo:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP
      - "9095:9095"   # Tempo gRPC
      - "4319:4317"   # OTLP gRPC (direct access if needed)
    networks:
      - dash-monitor
    restart: unless-stopped

  # Grafana Loki - log aggregation system
  loki:
    image: grafana/loki:2.9.3
    container_name: dash-loki
    command: ["-config.file=/etc/loki/local-config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yml
      - ./data/loki:/loki
    ports:
      - "3100:3100"   # Loki HTTP
    networks:
      - dash-monitor
    restart: unless-stopped

  # Prometheus - metrics storage and querying
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: dash-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI
    depends_on:
      - otel-collector
    networks:
      - dash-monitor
    restart: unless-stopped

  # Grafana - visualization and dashboards
  grafana:
    image: grafana/grafana:10.2.3
    container_name: dash-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana UI
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - dash-monitor
    restart: unless-stopped

networks:
  dash-monitor:
    driver: bridge

volumes:
  tempo-data:
  loki-data:
  grafana-data:
